[project]
name = "translate"
version = "0.1.0"
description = "Near-real-time JA→EN transcription + translation from system audio (Teams, YouTube) on Windows/Linux"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faster-whisper>=1.0",
    "llama-cpp-python>=0.3",
    "silero-vad>=5.1",
    "soundcard>=0.4",
    "numpy>=2.0",
    "PySide6>=6.7",
    "huggingface-hub>=0.24",
    "resampy>=0.4.3",
    "torch>=2.2",
    "torchaudio>=2.2",
    "transformers>=4.45",
    "sentencepiece>=0.2",
    "accelerate>=0.30",
]

[project.scripts]
translate = "translate.cli:main"

[project.optional-dependencies]
openvino = [
    "openvino>=2024.4",
    "optimum[openvino]>=1.20",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "ipykernel",
    "ipywidgets",
    "soundfile>=0.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/translate"]
